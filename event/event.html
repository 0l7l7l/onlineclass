<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Semo - 메모장 노트 📝</title>
	<!-- Tailwind CSS CDN -->
	<script src="https://cdn.tailwindcss.com"></script>
	<!-- FontAwesome CDN -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<!-- Canvas Confetti (당첨 효과) -->
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Pretendard:wght@400;600;800&display=swap');

		/* 메모장 바탕 격자/줄노트 배경 */
		body {
			font-family: 'Pretendard', sans-serif;
			background-color: #f4f4f4;
			color: #111111;
			/* 모눈종이 격자 패턴 */
			background-image: linear-gradient(to right, #e5e5e5 1px, transparent 1px), linear-gradient(to bottom, #e5e5e5 1px, transparent 1px);
			background-size: 20px 20px;
			-webkit-tap-highlight-color: transparent;
		}

		.font-mono-code {
			font-family: 'Courier Prime', monospace;
		}

		.font-jp {
			font-family: 'Noto Sans JP', sans-serif;
		}

		/* 메모장 감성의 또박또박한 바탕체/명조체 */
		.font-notepad {
			font-family: 'Gowun Batang', serif;
		}

		/* 흑백 테이프/클립 액센트 */
		.memo-tape {
			background-color: rgba(255, 255, 255, 0.85);
			border: 1px dashed #111111;
		}

		/* 메모장 버튼 (선명한 흑백 대비) */
		.btn-notepad {
			background-color: #111111;
			color: #ffffff;
			transition: all 0.15s ease;
		}

			.btn-notepad:active {
				background-color: #333333;
				transform: translateY(2px);
			}

		.btn-outline {
			background-color: #ffffff;
			color: #111111;
			border: 2px solid #111111;
		}

			.btn-outline:active {
				background-color: #eeeeee;
			}

		/* 나타남 애니메이션 */
		@keyframes fadeInMemo {
			from {
				opacity: 0;
				transform: translateY(8px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.animate-memo {
			animation: fadeInMemo 0.35s ease-out forwards;
		}
	</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6">

	<!-- 메모장 내지 프레임 컨테이너 (최대 너비 400px) -->
	<div class="w-full max-w-[400px] min-h-[660px] bg-white border-2 border-black shadow-[8px_8px_0px_#111111] rounded-none p-6 flex flex-col justify-between relative">

		<!-- 메모장 상단 바인더 구멍 디테일 -->
		<div class="absolute -top-3 left-0 right-0 flex justify-around px-8 pointer-events-none">
			<div class="w-3 h-3 bg-neutral-300 rounded-full border border-black"></div>
			<div class="w-3 h-3 bg-neutral-300 rounded-full border border-black"></div>
			<div class="w-3 h-3 bg-neutral-300 rounded-full border border-black"></div>
			<div class="w-3 h-3 bg-neutral-300 rounded-full border border-black"></div>
			<div class="w-3 h-3 bg-neutral-300 rounded-full border border-black"></div>
		</div>

		<!-- =================================================================== -->
		<!-- 1. HEADER (Semo Notepad Logo)                                       -->
		<!-- =================================================================== -->
		<header class="flex justify-between items-center border-b-2 border-black pb-3 pt-2">
			<div class="flex items-center gap-2">
				<span class="font-mono-code font-bold text-lg tracking-widest text-black">[SEMO.TXT]</span>
			</div>
			<span class="font-mono-code text-xs px-2 py-0.5 border border-black bg-neutral-100">
				MEMO_NOTE
			</span>
		</header>

		<!-- =================================================================== -->
		<!-- 2. SCREEN 1: 첫 화면 (의미 확인 전)                                 -->
		<!-- =================================================================== -->
		<main id="screen-question" class="flex-1 flex flex-col justify-center items-center my-6 text-center">

			<div class="memo-tape px-3 py-1 mb-6 text-xs font-mono-code text-neutral-600">
				-- NOTE #01 --
			</div>

			<!-- 일본어 텍스트 카드 (메모지에 적힌 텍스트) -->
			<div class="w-full border-2 border-black p-8 my-2 bg-neutral-50 relative shadow-[4px_4px_0px_#111111]">
				<p class="text-xs font-mono-code text-neutral-400 uppercase mb-2">Japanese Message</p>

				<!-- 일본어 표기 -->
				<h1 id="q-japanese-text" class="font-jp font-bold text-3xl sm:text-4xl text-black leading-snug tracking-wider my-3">
					来てくれる？
				</h1>

				<!-- 읽기 힌트 -->
				<p id="q-reading-text" class="font-jp text-xs text-neutral-500 font-medium">
					[きてくれる？]
				</p>
			</div>

			<p class="font-notepad text-xs text-neutral-600 mt-6 border-b border-neutral-300 pb-0.5">
				이 메모의 의미가 궁금하신가요?
			</p>
		</main>

		<!-- =================================================================== -->
		<!-- 3. SCREEN 2: 결과 화면 (의미 확인 후 & 당첨 결과)                  -->
		<!-- =================================================================== -->
		<main id="screen-result" class="hidden flex-1 flex-col justify-center items-center my-4 text-center animate-memo">

			<!-- 1. 의미 해설 카드 -->
			<div class="w-full border-2 border-black p-5 relative mb-4 text-left bg-white shadow-[4px_4px_0px_#111111]">
				<div class="border-b border-black pb-2 mb-3 flex justify-between items-center">
					<span class="font-mono-code text-xs font-bold bg-black text-white px-2 py-0.5">MEANING</span>
					<span id="r-reading-text" class="font-jp text-xs text-neutral-500">きてくれる？</span>
				</div>

				<h2 id="r-japanese-text" class="font-jp font-bold text-xl text-black mb-1">来てくれる？</h2>

				<!-- 뜻 -->
				<p id="r-meaning-text" class="font-notepad text-lg font-bold text-black mb-3 underline decoration-1 underline-offset-4">
					"와 줄래?"
				</p>

				<!-- 설명 -->
				<p id="r-explanation-text" class="font-notepad text-xs text-neutral-700 leading-relaxed bg-neutral-100 p-3 border-l-2 border-black">
					친한 친구나 연인에게 '와 줄 수 있는지' 다정하게 물어볼 때 쓰는 회화 표현입니다.
				</p>
			</div>

			<!-- 2. 당첨 이벤트 결과 카드 -->
			<div class="w-full border-2 border-black p-4 text-center bg-neutral-50 relative shadow-[4px_4px_0px_#111111]">
				<span class="font-mono-code text-[10px] font-bold text-neutral-500 block mb-1">[ EVENT RESULT ]</span>

				<h3 class="font-notepad text-xs font-bold text-black">Semo 포인트 당첨 안내</h3>

				<!-- 당첨 상품 -->
				<div class="my-3 border border-black bg-white p-3 shadow-[2px_2px_0px_#111111]">
					<span id="prize-name" class="font-notepad font-bold text-sm text-black">
						🎉 Semo 300 세모(포인트) 당첨!
					</span>
				</div>

				<p class="font-notepad text-[11px] text-neutral-600">
					회원가입 후 포인트를 바로 적립받으세요.
				</p>
			</div>

		</main>

		<!-- =================================================================== -->
		<!-- 4. BOTTOM ACTION BUTTONS                                            -->
		<!-- =================================================================== -->
		<footer class="mt-4 pt-3 border-t-2 border-black">
			<!-- Screen 1 버튼 -->
			<button id="btn-reveal" onclick="revealMeaning()" class="btn-notepad w-full font-notepad font-bold text-base py-3.5 border-2 border-black cursor-pointer flex items-center justify-center gap-2">
				<span>[ 의미 확인하기 ]</span>
			</button>

			<!-- Screen 2 버튼 (의미 확인 후 노출) -->
			<div id="result-actions" class="hidden flex-col gap-2">
				<a href="https://www.semo-lang.com/signup" target="_blank" class="btn-notepad w-full font-notepad font-bold text-sm py-3.5 border-2 border-black text-center decoration-none block">
					Semo 시작하기 & 포인트 받기
				</a>

				<button onclick="location.reload()" class="btn-outline w-full font-mono-code text-xs py-2 font-bold transition">
					RELOAD_MEMO (다른 메모 확인)
				</button>
			</div>
		</footer>

	</div>

	<!-- =================================================================== -->
	<!-- 5. JS & DB FETCH LOGIC                                              -->
	<!-- =================================================================== -->
	<script>
        // URL 파라미터에서 QR 키값 가져오기 (?qr=CA001)
        const urlParams = new URLSearchParams(window.location.search);
        const qrKey = urlParams.get('qr') || 'CA001';

        // 페이지 로드 시 api.php 연동
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch(`api.php?action=event_scan&qr_key=${qrKey}`);
                const result = await response.json();

                if (result.status === 'success') {
                    const data = result.data;

                    // 첫 화면
                    document.getElementById('q-japanese-text').innerText = data.content.text;
                    document.getElementById('q-reading-text').innerText = data.content.reading ? `[${data.content.reading}]` : '';

                    // 결과 화면
                    document.getElementById('r-japanese-text').innerText = data.content.text;
                    document.getElementById('r-reading-text').innerText = data.content.reading || '';
                    document.getElementById('r-meaning-text').innerText = `"${data.content.meaning}"`;
                    document.getElementById('r-explanation-text').innerText = data.content.explanation || '일상에서 편하게 쓰는 표현입니다.';

                    document.getElementById('prize-name').innerText = `🎉 ${data.prize.name}`;
                }
            } catch (error) {
                console.error('API 연동 실패:', error);
            }
        });

        // "의미 확인하기" 버튼 동작
        function revealMeaning() {
            document.getElementById('screen-question').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('screen-result').classList.add('flex');

            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('result-actions').classList.remove('hidden');
            document.getElementById('result-actions').classList.add('flex');

            // 흑백 감성에 맞춘 세련된 미니멀 폭죽
            confetti({
                particleCount: 50,
                spread: 50,
                origin: { y: 0.7 },
                colors: ['#111111', '#888888', '#ffffff']
            });
        }
	</script>
</body>
</html>
