<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SEMO 가타카나 마스터반 교재</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html {
    scroll-behavior: smooth;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

    background: #e8e8e6;

    color: #222;

    line-height: 1.7;
}


/* =====================================================
   BOOK
===================================================== */

.book {

    width: 100%;

    padding: 40px 0;
}


/* =====================================================
   A4 SHEET
   297mm × 210mm
===================================================== */

.sheet {

    width: 297mm;

    height: 210mm;

    margin: 0 auto 30mm;

    display: grid;

    grid-template-columns: 1fr 1fr;

    background: #fff;

    box-shadow:
        0 5px 25px rgba(0,0,0,.10);

    position: relative;
}


/* =====================================================
   PAGE
   A4의 정확히 절반
   148.5mm × 210mm
===================================================== */

.page {

    width: 148.5mm;

    height: 210mm;

    padding: 14mm;

    background: #fff;

    position: relative;

    overflow: hidden;
}


/*
   가운데는 실제 A4의 가운데
   별도의 gap 없음
*/

.page:first-child {

    border-right: 1px solid #e7e7e7;

}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number {

    position: absolute;

    right: 9mm;

    bottom: 7mm;

    font-size: 9px;

    color: #aaa;
}


/* =====================================================
   COVER
===================================================== */

.cover {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background: #222;

    color: #fff;
}


.logo {

    font-size: 17px;

    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 25px;
}


.cover .label {

    color: rgba(255,255,255,.55);

    margin-bottom: 15px;
}


.cover h1 {

    font-size: 38px;

    line-height: 1.2;

    letter-spacing: -2px;
}


.cover h1 span {

    display: block;

    margin-top: 15px;

    font-size: 14px;

    font-weight: 400;

    line-height: 1.6;

    color: rgba(255,255,255,.7);
}


.cover-kana {

    margin-top: 40px;

    font-size: 32px;

    font-weight: 700;

    letter-spacing: 8px;
}


/* =====================================================
   COMMON
===================================================== */

.label {

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 2px;

    color: #999;

    margin-bottom: 8px;
}


h2 {

    font-size: 27px;

    line-height: 1.35;

    letter-spacing: -1.5px;

    margin-bottom: 18px;
}


h3 {

    font-size: 17px;

    line-height: 1.4;

    margin-bottom: 10px;
}


p {

    font-size: 13px;

    line-height: 1.7;

    color: #555;
}


/* =====================================================
   INTRO
===================================================== */

.intro-text {

    margin-top: 15px;
}


/* =====================================================
   WORD GRID
===================================================== */

.word-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 20px;
}


.word-card {

    padding: 13px;

    border: 1px solid #e5e5e5;

    border-radius: 11px;

    background: #fff;
}


.word-card strong {

    display: block;

    font-size: 20px;

    line-height: 1.3;

    margin-bottom: 3px;
}


.word-card span {

    display: block;

    font-size: 11px;

    color: #777;
}


/* =====================================================
   KANA
===================================================== */

.kana-title {

    font-size: 65px;

    line-height: 1;

    font-weight: 900;

    margin: 15px 0 20px;
}


.kana-row {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 5px;

    margin-bottom: 20px;
}


.kana-box {

    padding: 9px 3px;

    background: #f3f3f0;

    border-radius: 9px;

    text-align: center;

    font-size: 25px;

    font-weight: 900;
}


.kana-box span {

    display: block;

    font-size: 9px;

    font-weight: 500;

    color: #888;

    margin-top: 2px;
}


/* =====================================================
   SPEAK BOX
===================================================== */

.speak-box {

    margin-top: 18px;

    padding: 15px;

    background: #f3f3f0;

    border-radius: 12px;

    text-align: center;
}


.speak-title {

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1px;

    margin-bottom: 7px;
}


.speak-text {

    font-size: 23px;

    line-height: 1.6;

    font-weight: 900;

    letter-spacing: 5px;
}


/* =====================================================
   PRACTICE
===================================================== */

.practice {

    margin-top: 18px;
}


.practice-row {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 7px 0;

    border-bottom: 1px dashed #ddd;
}


.practice-kana {

    width: 30px;

    font-size: 22px;

    font-weight: 900;
}


.practice-line {

    flex: 1;

    height: 28px;

    border-bottom: 1px solid #aaa;
}


/* =====================================================
   CHECK
===================================================== */

.check-box {

    margin-top: 18px;

    padding: 14px;

    background: #222;

    color: #fff;

    border-radius: 12px;
}


.check-box strong {

    display: block;

    font-size: 13px;

    margin-bottom: 3px;
}


.check-box p {

    font-size: 11px;

    color: #ddd;
}


/* =====================================================
   IMAGE
===================================================== */

.page-image {

    width: 100%;

    display: block;

    margin: 18px 0;

    border-radius: 12px;

    object-fit: cover;
}


/* =====================================================
   FINAL
===================================================== */

.final-message {

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}


.final-message .big {

    font-size: 32px;

    font-weight: 900;

    line-height: 1.4;
}


.final-message p {

    margin-top: 15px;
}


/* =====================================================
   PRINT
===================================================== */

@page {

    size: A4 landscape;

    margin: 0;
}


@media print {

    html,
    body {

        width: 297mm;

        margin: 0;

        padding: 0;

        background: #fff;
    }


    .book {

        padding: 0;
    }


    .sheet {

        width: 297mm;

        height: 210mm;

        margin: 0;

        box-shadow: none;

        break-after: page;

        page-break-after: always;
    }


    .sheet:last-child {

        break-after: auto;

        page-break-after: auto;
    }


    .page {

        width: 148.5mm;

        height: 210mm;

        padding: 14mm;

        box-shadow: none;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media screen and (max-width: 900px) {

    body {

        background: #f5f5f3;
    }


    .book {

        padding: 15px 0;
    }


    /*
       모바일에서는
       A4를 가로로 유지하지 않고
       페이지 하나씩 보여줌
    */

    .sheet {

        width: 100%;

        height: auto;

        margin: 0;

        display: block;

        background: transparent;

        box-shadow: none;
    }


    .page {

        width: 100%;

        height: auto;

        aspect-ratio: 148.5 / 210;

        margin-bottom: 18px;

        padding: 8vw;

        box-shadow:
            0 3px 15px rgba(0,0,0,.08);

        overflow: hidden;
    }


    .page:first-child {

        border-right: none;
    }


    .page-number {

        bottom: 4vw;

    .cover-kana {

    }

    }

    }

        font-size: 7vw;

    }

        font-size: 6vw;

        letter-spacing: 1.5vw;
    }


    .word-card {

        padding: 3vw;
    }


    .word-card strong {

        font-size: 5vw;
    }


    .word-card span {

        font-size: 3vw;
    }


    .practice-kana {

        width: 8vw;

        font-size: 6vw;
    }


    .practice-line {

        height: 8vw;
    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media screen and (max-width: 400px) {

    .page {

        padding: 7vw;
    }

}

</style>

</head>

/* =====================================================
   📄 A4 SHEET 자동 생성
=====================================================

   pages

   [0] + [1]
       ↓
   A4 ①

   [2] + [3]
       ↓
   A4 ②


===================================================== */


const book =
    document.getElementById("book");


for (
    let i = 0;
    i < pages.length;
    i += 2
) {


    /* =========================================
       A4 생성
    ========================================= */

    const sheet =
        document.createElement("div");


    sheet.className =
        "sheet";


    /* =========================================
       최대 2페이지
    ========================================= */

    const firstPage =
        createPage(
            pages[i],
            i
        );


    sheet.appendChild(
        firstPage
    );


    /* =========================================
       두 번째 페이지가 존재한다면 생성
    ========================================= */

    if (
        pages[i + 1]
    ) {

        const secondPage =
            createPage(
                pages[i + 1],
                i + 1
            );


        sheet.appendChild(
            secondPage
        );

    }


    /* =========================================
       A4를 BOOK에 추가
    ========================================= */

    book.appendChild(
        sheet
    );

}


/* =====================================================
   PAGE 생성 함수
===================================================== */

function createPage(
    page,
    index
) {


    const pageElement =
        document.createElement("div");


    pageElement.className =
        "page";


    /* =========================================
       COVER
    ========================================= */

    if (
        page.type === "cover"
    ) {


        pageElement.classList.add(
            "cover"
        );


        pageElement.innerHTML = `

            <div class="logo">

                △ SEMO

            </div>


            <div class="label">

                ${page.label || ""}

            </div>


            <h1>

                ${page.title || ""}


                <span>

                    ${page.subtitle || ""}

                </span>

            </h1>


            <div class="cover-kana">

                ${page.kana || ""}

            </div>

        `;

    }


    /* =========================================
       NORMAL PAGE
    ========================================= */

    else {


        pageElement.innerHTML = `

            <div class="label">

                ${page.label || ""}

            </div>


            <h2>

                ${page.title || ""}

            </h2>


            ${page.html || ""}

        `;

    }


    /* =========================================
       PAGE NUMBER
    ========================================= */

    const pageNumber =
        document.createElement("div");


    pageNumber.className =
        "page-number";


    pageNumber.textContent =
        index + 1;


    pageElement.appendChild(
        pageNumber
    );


    return pageElement;

}
